# This GitHub Action automates the process of building, signing, and releasing Grafana plugins.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Sign plugin
        # Public (community/commercial) signature: no --rootUrls. Grafana picks the
        # level it granted to the `vtexio` org during catalog review. If this step
        # fails with "Field is required: rootUrls", the level has not been granted
        # yet — do not fall back to `npm run sign:private`; a private MANIFEST
        # trips the catalog validator ("plugin must be signed under community or
        # commercial signature level").
        # https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin
        run: npm run sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

      - name: Check signature level
        run: |
          set -euo pipefail
          level=$(grep -m1 '"signatureType"' dist/MANIFEST.txt | sed -E 's/.*"signatureType": *"([^"]+)".*/\1/')
          echo "MANIFEST.txt signatureType=$level"
          case "$level" in
            community|commercial) ;;
            *)
              echo "FAIL: expected a community or commercial signature, got '$level'"
              exit 1
              ;;
          esac

      - name: Package plugin
        run: npm run package

      - name: Locate built artifact
        id: artifact
        run: |
          file=$(ls vtexio-grafana-plugin-build/*.zip | head -n1)
          if [ -z "$file" ]; then
            echo "No .zip found in vtexio-grafana-plugin-build/"; exit 1
          fi
          echo "path=$file" >> $GITHUB_OUTPUT
          echo "name=$(basename "$file")" >> $GITHUB_OUTPUT

      - name: Validate plugin package
        # Same validator the Grafana catalog runs on submission. The full analyzer
        # set (not only metadatavalid) is what reports the signature-level warning,
        # so fail the release if it shows up again.
        run: |
          set -euo pipefail
          docker run --pull=always --rm \
            -v "$PWD/${{ steps.artifact.outputs.path }}:/archive.zip" \
            grafana/plugin-validator-cli /archive.zip 2>&1 | tee validator.log
          if grep -q "signed under community or commercial signature level" validator.log; then
            echo "FAIL: catalog validator still reports a private signature"
            exit 1
          fi

      - name: Verify Plugin Signature
        run: |
          set -euo pipefail

          # Every other check we run (local dev, CI e2e) sets
          # GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS, which bypasses signature
          # verification entirely. Nothing has ever tested the path a real
          # customer's Grafana actually takes: verify the signature, then load.
          mkdir -p verify-plugin
          unzip -q "${{ steps.artifact.outputs.path }}" -d verify-plugin
          plugin_dir=$(find verify-plugin -mindepth 1 -maxdepth 1 -type d | head -n1)
          chmod +x "$plugin_dir"/gpx_* 2>/dev/null || true

          docker run -d --name grafana-signature-check \
            -p 3001:3000 \
            -v "$PWD/$plugin_dir:/var/lib/grafana/plugins/vtexio-grafana-datasource" \
            grafana/grafana-enterprise:11.5.3

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/login; then
              echo "Grafana is up"
              break
            fi
            sleep 2
          done

          logs=$(docker logs grafana-signature-check 2>&1)
          echo "$logs" | tail -100

          if echo "$logs" | grep -qi "permitting unsigned plugin"; then
            echo "FAIL: plugin loaded only because signature verification was bypassed"
            exit 1
          fi
          if ! echo "$logs" | grep -q 'pluginId=vtexio-grafana-datasource'; then
            echo "FAIL: plugin never registered with Grafana"
            exit 1
          fi
          echo "OK: plugin registered with signature verification enforced"

      - name: Tear down signature-check Grafana
        if: always()
        run: docker rm -f grafana-signature-check 2>/dev/null || true

      - name: Upload signed plugin to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
